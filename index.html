<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#9d2b93">
  <link rel="icon" type="image/png" sizes="283x283" href="jim-gpt-launcher-icon.png">
  <link rel="apple-touch-icon" sizes="283x283" href="jim-gpt-launcher-icon.png">
  <title>Jim GPT Launcher</title>
  <style>body{font-family:system-ui,sans-serif;background:#f7eef8;color:#241526;display:grid;place-items:center;min-height:100vh;margin:0}main{text-align:center;padding:2rem}img{width:96px;height:96px;border-radius:22px}a{display:inline-block;margin-top:1.5rem;padding:.8rem 1.2rem;border-radius:10px;background:#9d2b93;color:#fff;text-decoration:none;font-weight:700}</style>
</head>
<body><main><img src="jim-gpt-launcher-icon.png" alt="Jim GPT Launcher"><h1>Jim GPT Launcher</h1><p>This front door clears this browser's launcher state, then opens the current governed SEW endpoint. If the endpoint identity is not current, do not continue.</p><a id="open-launcher" href="https://script.google.com/macros/s/AKfycbyG9HNHUK7sG8MB-Y0XWZNsOU4_AxVyEB8q_yBH3Ji-OPqhKK48acgpOypX3owuHQ3O/exec?route=launcher">Open current launcher</a></main><script>
const link=document.getElementById('open-launcher');
link.addEventListener('click',async event=>{
  event.preventDefault();
  try {
    localStorage.clear(); sessionStorage.clear();
    if ('serviceWorker' in navigator) await Promise.all((await navigator.serviceWorker.getRegistrations()).map(r=>r.unregister()));
    if (window.caches) await Promise.all((await caches.keys()).map(k=>caches.delete(k)));
  } finally { window.location.assign(link.href+'&frontDoor='+Date.now()); }
});
</script></body>
</html>
